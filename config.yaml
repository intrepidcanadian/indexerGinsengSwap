# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: gswap_v3
# Reorg rollback is OFF, and that is deliberate — see the block_lag note below.
# On 2026-08-02 this indexer wedged in an endless reorg-rollback loop that burned
# a month of RPC quota while advancing zero blocks. block_lag keeps us out of the
# zone where that can happen; this makes the loop structurally impossible rather
# than merely unlikely. Safe only BECAUSE of block_lag: at 300 blocks (~6 min)
# deep the blocks are settled, so there is nothing left to roll back. If block_lag
# is ever reduced, turn this back on.
rollback_on_reorg: false
# No global field_selection. It existed to give the Earn audit-trail entities a
# txHash on every event; with those gone, each DEX event declares exactly the
# transaction fields its handler reads. That matters on an RPC data source —
# requesting transaction fields forces transaction/block fetches, and PoolCreated
# and Initialize need none.
contracts:
  - name: UniswapV3Factory
    events:
      - event: PoolCreated(address indexed token0, address indexed token1, uint24 indexed fee, int24 tickSpacing, address pool)
  - name: UniswapV3Pool
    events:
      - event: Initialize(uint160 sqrtPriceX96, int24 tick)
      - event: Collect(address indexed owner, address recipient, int24 indexed tickLower, int24 indexed tickUpper, uint128 amount0, uint128 amount1)
        field_selection:
          transaction_fields:
            - hash
            - gasPrice
      - event: Burn(address indexed owner, int24 indexed tickLower, int24 indexed tickUpper, uint128 amount, uint256 amount0, uint256 amount1)
        field_selection:
          transaction_fields:
            - hash
            - gasPrice
            - from
      - event: Mint(address sender, address indexed owner, int24 indexed tickLower, int24 indexed tickUpper, uint128 amount, uint256 amount0, uint256 amount1)
        field_selection:
          transaction_fields:
            - hash
            - gasPrice
            - from
      - event: Swap(address indexed sender, address indexed recipient, int256 amount0, int256 amount1, uint160 sqrtPriceX96, uint128 liquidity, int24 tick)
        field_selection:
          transaction_fields:
            - hash
            - gasPrice
            - from

  # tokenId-level position lifecycle — powers per-position history, age, and
  # earned-fee tracking in the frontend (pool events only see the Position
  # Manager as the owner, so tokenIds are invisible without these).
  - name: NonfungiblePositionManager
    events:
      - event: IncreaseLiquidity(uint256 indexed tokenId, uint128 liquidity, uint256 amount0, uint256 amount1)
        field_selection:
          transaction_fields:
            - hash
            - from
      - event: DecreaseLiquidity(uint256 indexed tokenId, uint128 liquidity, uint256 amount0, uint256 amount1)
        field_selection:
          transaction_fields:
            - hash
            - from
      - event: Collect(uint256 indexed tokenId, address recipient, uint256 amount0, uint256 amount1)
        field_selection:
          transaction_fields:
            - hash
            - from
      - event: Transfer(address indexed from, address indexed to, uint256 indexed tokenId)
        field_selection:
          transaction_fields:
            - hash
            - from

chains:
  - id: 1030 # Conflux eSpace
    # 25 blocks before the FIRST PoolCreated (block 119,639,225 — the six
    # launch pools land in 119,639,225..119,639,675). Do not "optimize" this
    # upward: a 2026-08-25 change moved it to 121,756,400 off a mis-hexed
    # getLogs probe and silently dropped those six pools and ~20k transactions
    # from the index. Verified on-chain 2026-09-01:
    #   [119,639,200 .. 121,756,399] → 6 PoolCreated
    #   [121,756,400 .. tip]         → 36 PoolCreated (42 total)
    start_block: 119639200
    # Index ~6 minutes behind the tip. THIS IS WHAT KEEPS THE INDEXER ALIVE — do not
    # remove it without understanding the failure it prevents.
    #
    # On 2026-08-02 the indexer wedged at block 153,396,448 in an endless
    # reorg-rollback loop. It had that block stored as hash 0xa2fc1008…, every poll
    # returned 0xa5eaa0f0…, so it declared a reorg and rolled back — but the rollback
    # refetches from targetBlock+1 and never re-reads the target itself, so the stale
    # hash was never corrected and the next poll re-detected the same "reorg".
    # Identical block, identical hashes, identical checkpoints (70729 -> 70607),
    # rollbackedEvents: 0, thousands of cycles per second, each firing one range query
    # per partition. That loop — not the historical sync, which takes 11 minutes —
    # burned ~4.26M eth_getLogs plus a matching 4.26M eth_getBlockByNumber in a day
    # while advancing zero blocks, and it drained the metered gateway's quota.
    #
    # Envio's reorg window here is 200 blocks, so lagging 300 keeps us clear of the
    # zone where eSpace hashes are still unsettled (Tree-Graph pivot near the tip,
    # and/or a load-balanced gateway whose backends disagree on the hash).
    block_lag: 300

    # Conflux eSpace has no HyperSync endpoint (chain_metadata reports
    # is_hyper_sync: false), so all sync traffic goes over RPC.
    #
    # The metered gateway is the sync source AND polling_interval is 30000.
    # Both halves matter — the 2026-08 quota disaster was the gateway at the
    # DEFAULT 1s polling (one eth_blockNumber + one eth_getLogs per partition +
    # one header per ~1.16s block, each its own HTTP POST; envio never batches
    # JSON-RPC ≈ 300k requests/day ≈ 27M TU/month) plus the 08-02 reorg loop.
    # At 30s polling the same gateway costs ~30k TU/day ≈ 0.9M TU/month of the
    # 25M free plan — affordable permanently, with headroom for backfills.
    #
    # polling_interval 30000 is the load-bearing knob. The evm.schema.json note
    # claims raising it cannot reduce usage ("every block is still fetched to
    # check for reorgs") — that is WRONG for the 3.2.1 RPC path, verified in
    # envio's sources: reorg hashes are harvested for free from range-endpoint
    # headers plus log.blockHash (RpcSource.res ~1227), and one 30s cycle covers
    # all ~26 elapsed blocks with a single getLogs per partition. The extra 30s
    # of indexing latency is nothing on top of block_lag's ~6 minutes, and every
    # consumer caches for 5+ minutes anyway.
    #
    # Why not sync on the free public node? Tried 2026-08-30 → 09-01: its
    # 5-concurrent cap ("exceeds 5", JSON-RPC -32005) makes envio's backoff
    # shrink the scan window 0.8x per refusal, and Development-plan deployments
    # hibernate when idle — the historical backfill managed 8.4% in two days
    # (weeks to finish), during which every indexer-backed frontend surface
    # 502s. The gateway backfills the same range in ~minutes (measured 8/8
    # parallel 10k-block getLogs vs confluxrpc 5/8, unifra 1/8, blockpi 0/8).
    # Config changes mean a NEW deployment and a from-scratch resync, so
    # "public for steady state, gateway for backfill" role-flipping costs a
    # full resync each flip — not worth it at 0.9M TU/month steady state.
    #
    # KNOWN TRADEOFF: the gateway URL embeds its access key and this repo is
    # public, so the key is effectively public too. This is deliberate: Envio
    # Cloud builds straight from GitHub and its env-var feature is on a paid
    # tier, so a committed literal is the only free way to use the gateway.
    # The exposure is bounded — the key can only spend the free gateway quota.
    # The previous key (2TURb…, in git history) was rotated dead 2026-08-25.
    # If quota drains far faster than ~1M TU/month with no matching stall or
    # backfill, assume the key is being farmed and rotate again.
    rpc:
      - url: https://cfx-espace.gateway.tenderly.co/3ltDBcr0rrr9ZZpUdGVJKs
        for: sync
        polling_interval: 30000
      # Free public node — fallback only (its ws newHeads stream engages if it
      # ever becomes the active height source). Envio auto-returns to the sync
      # source within ~60s of recovery, so this normally carries no traffic.
      - url: https://evm.confluxrpc.com
        ws: wss://evm.confluxrpc.com/ws
        for: fallback
        polling_interval: 30000
    contracts:
      - name: UniswapV3Factory
        address: 0x62Aa0294cB42Aae39b7772313eAdfa5d489146eC
      - name: NonfungiblePositionManager
        address: 0x820A73ba72A21f0AEF985dB6FB3E923b343b7Dbe
      - name: UniswapV3Pool
